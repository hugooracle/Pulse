name: Pulse internal identity cleanup

on:
  push:
    branches:
      - refactor/pulse-full-rebrand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'hugooracle' && !contains(github.event.head_commit.message, '[pulse-internals]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rename internal icon namespace and remove unused AI alias
        shell: bash
        run: |
          set -euo pipefail

          find composeApp -type f -name '*.kt' -print0 | xargs -0 sed -i 's/SimpIcons/PulseIcons/g'

          if [ -f composeApp/src/commonMain/kotlin/pt/pulse/app/ui/icon/SimpIcons.kt ]; then
            git mv composeApp/src/commonMain/kotlin/pt/pulse/app/ui/icon/SimpIcons.kt \
              composeApp/src/commonMain/kotlin/pt/pulse/app/ui/icon/PulseIcons.kt
          fi

          sed -i '/^gemini-kotlin = "4\.0\.2"$/d' gradle/libs.versions.toml
          sed -i '/^gemini-kotlin = { module = .*openai-client.*version\.ref = "gemini-kotlin" }$/d' gradle/libs.versions.toml

          rm -f .github/workflows/pulse-clean-internals.yml

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIl --exclude-dir=.git --include='*.kt' 'SimpIcons' composeApp | grep -q .; then
            grep -RIn --exclude-dir=.git --include='*.kt' 'SimpIcons' composeApp
            exit 1
          fi
          if grep -n 'gemini-kotlin.*openai-client' gradle/libs.versions.toml; then
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hugo"
          git config user.email "hugo.oracle@gmail.com"
          git add -A
          git status --short
          git commit -m "refactor: finish Pulse internal identity cleanup [pulse-internals]"
          git push origin HEAD:refactor/pulse-full-rebrand
