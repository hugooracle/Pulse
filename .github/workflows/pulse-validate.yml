name: Pulse validation

on:
  push:
    branches:
      - refactor/pulse-full-rebrand
  workflow_dispatch:

concurrency:
  group: pulse-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Identity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          legal = {'LICENSE', 'LICENSE.md', 'NOTICE.md'}
          self_path = '.github/workflows/pulse-validate.yml'
          legacy_name = 'simp' + 'music'
          legacy_icons = 'simp' + 'icons'
          forbidden = (legacy_name, legacy_name + '.org', legacy_name + '://', legacy_icons, 'pulse' + '.org')
          text_ext = {'.kt','.kts','.java','.xml','.md','.txt','.json','.yml','.yaml','.toml','.properties','.gradle','.pro','.conf','.cfg','.sh','.ps1','.bat','.html','.css','.js','.ts','.swift','.plist','.py','.svg'}
          special = {'gradlew','gradlew.bat','.gitignore','.gitattributes','Dockerfile','conveyor.conf','Gemfile','Podfile'}
          hits = []

          for p in root.rglob('*'):
              rel = p.as_posix()
              if rel == self_path or '.git' in p.parts or not p.is_file() or p.name in legal:
                  continue
              if legacy_name in rel.lower() or legacy_icons in rel.lower():
                  hits.append(f'path: {rel}')
                  continue
              if p.suffix.lower() not in text_ext and p.name not in special:
                  continue
              try:
                  text = p.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if any(token in text for token in forbidden):
                  hits.append(rel)

          if hits:
              print('\n'.join(hits[:250]))
              raise SystemExit(f'Found {len(hits)} legacy identity reference(s)')
          print('Identity audit passed.')
          PY

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
