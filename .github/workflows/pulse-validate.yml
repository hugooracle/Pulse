name: Pulse validation

on:
  push:
    branches:
      - refactor/pulse-full-rebrand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle

      - name: Identity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          legal = {'LICENSE', 'LICENSE.md', 'NOTICE.md'}
          forbidden = ('simpmusic', 'simpmusic.org', 'simpmusic://', 'pulse.org')
          text_ext = {'.kt','.kts','.java','.xml','.md','.txt','.json','.yml','.yaml','.toml','.properties','.gradle','.pro','.conf','.cfg','.sh','.ps1','.bat','.html','.css','.js','.ts','.swift','.plist','.py','.svg'}
          special = {'gradlew','gradlew.bat','.gitignore','.gitattributes','Dockerfile','conveyor.conf','Gemfile','Podfile'}
          hits = []

          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.name in legal:
                  continue
              if 'simpmusic' in p.as_posix().lower():
                  hits.append(f'path: {p.as_posix()}')
                  continue
              if p.suffix.lower() not in text_ext and p.name not in special:
                  continue
              try:
                  text = p.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if any(token in text for token in forbidden):
                  hits.append(p.as_posix())

          if hits:
              print('\n'.join(hits[:250]))
              raise SystemExit(f'Found {len(hits)} legacy identity reference(s)')
          print('Identity audit passed: no legacy SimpMusic identity outside legal notices.')
          PY

      - name: Generate library definitions
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
