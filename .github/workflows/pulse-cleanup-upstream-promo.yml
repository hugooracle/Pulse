name: Pulse upstream promotion cleanup

on:
  push:
    branches:
      - refactor/pulse-full-rebrand

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Remove inherited promotional surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('composeApp/src/commonMain/kotlin/pt/pulse/app/ui/screen/home/SettingScreen.kt')
          text = settings.read_text(encoding='utf-8')

          for line in [
              'import androidx.compose.ui.platform.LocalUriHandler',
              'import pulse.composeapp.generated.resources.author',
              'import pulse.composeapp.generated.resources.blog_notification_description',
              'import pulse.composeapp.generated.resources.blog_notification_title',
              'import pulse.composeapp.generated.resources.buy_me_a_coffee',
              'import pulse.composeapp.generated.resources.developer_blog',
              'import pulse.composeapp.generated.resources.developer_blog_tagline',
              'import pulse.composeapp.generated.resources.donation',
              'import pulse.composeapp.generated.resources.maxrave_dev',
          ]:
              text = text.replace(line + '\n', '')

          text = text.replace('    val uriHandler = LocalUriHandler.current\n', '')
          text = text.replace(
              '    val blogNotificationEnabled by viewModel.blogNotificationEnabled.collectAsStateWithLifecycle()\n',
              '',
          )

          start_marker = '''                SettingItem(\n                    title = stringResource(Res.string.author),'''
          end_marker = '''                SettingItem(\n                    title = stringResource(Res.string.third_party_libraries),'''
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate inherited About promotional block')
          text = text[:start] + text[end:]
          settings.write_text(text, encoding='utf-8')

          main = Path('androidApp/src/main/java/pt/pulse/app/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          for line in [
              'import androidx.lifecycle.lifecycleScope',
              'import pt.pulse.core.domain.manager.DataStoreManager',
              'import pt.pulse.app.service.rss.RssFeedNotifyWork',
              'import kotlinx.coroutines.launch',
          ]:
              text = text.replace(line + '\n', '')
          text = text.replace('    val dataStoreManager: DataStoreManager by inject()\n', '')

          start_marker = '''        lifecycleScope.launch {\n            dataStoreManager.blogNotificationEnabled.collect { enabled ->'''
          end_marker = '''\n\n        if (!EasyPermissions.hasPermissions(this, Manifest.permission.POST_NOTIFICATIONS)) {'''
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate inherited blog RSS scheduling block')
          text = text[:start] + end_marker + text[end + len(end_marker):]
          main.write_text(text, encoding='utf-8')
          PY

          git rm androidApp/src/main/java/pt/pulse/app/service/rss/RssFeedNotifyWork.kt
          git rm .github/workflows/pulse-cleanup-upstream-promo.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pulse CI"
          git config user.email "pulse-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove inherited upstream promotion and RSS"
          git push origin HEAD:refactor/pulse-full-rebrand
