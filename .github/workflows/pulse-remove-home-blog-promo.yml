name: Pulse remove home blog promo hook

on:
  push:
    branches:
      - refactor/pulse-full-rebrand

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Remove blog promo hook from Home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('composeApp/src/commonMain/kotlin/pt/pulse/app/ui/screen/home/HomeScreen.kt')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'import pt.pulse.app.ui.component.BlogPromoDialog\n': '',
              '// DataStore key for blog-promo one-shot dialog. Bump the suffix (v2, v3, …) to re-promote.\nprivate const val BLOG_PROMO_KEY = "blog_promo_v1_seen"\n\n': '',
              '    var showBlogPromoDialog by rememberSaveable {\n        mutableStateOf(false)\n    }\n': '',
              '''        } else if (openAppTime == 5) {\n            // Blog promo: one-shot after 5 app opens, bump key suffix to re-promote later\n            if (sharedViewModel.getString(BLOG_PROMO_KEY) != "true") {\n                showBlogPromoDialog = true\n            }\n''': '',
              '''    if (showBlogPromoDialog) {\n        BlogPromoDialog(\n            onDismissRequest = {\n                sharedViewModel.putString(BLOG_PROMO_KEY, "true")\n                showBlogPromoDialog = false\n            },\n            onVisitBlog = {\n                sharedViewModel.putString(BLOG_PROMO_KEY, "true")\n                showBlogPromoDialog = false\n            },\n        )\n    }\n\n''': '',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected HomeScreen blog-promo fragment not found:\n' + old)
              text = text.replace(old, new, 1)

          if 'BlogPromoDialog' in text or 'BLOG_PROMO_KEY' in text or 'showBlogPromoDialog' in text:
              raise SystemExit('Blog promo references remain in HomeScreen')

          p.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/pulse-remove-home-blog-promo.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Pulse CI"
          git config user.email "pulse-ci@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove inherited home blog promotion hook"
          git push origin HEAD:refactor/pulse-full-rebrand
