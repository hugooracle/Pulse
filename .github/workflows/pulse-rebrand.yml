name: Pulse full rebrand

on:
  push:
    branches:
      - refactor/pulse-full-rebrand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor == 'hugooracle' && !contains(github.event.head_commit.message, '[pulse-rebrand]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Incorporar core no Pulse
        shell: bash
        run: |
          set -euo pipefail
          cp -a core "$RUNNER_TEMP/pulse-core"
          rm -f "$RUNNER_TEMP/pulse-core/.git"
          git submodule deinit -f core || true
          git rm -f core
          rm -rf .git/modules/core
          rm -f .gitmodules
          mv "$RUNNER_TEMP/pulse-core" core

      - name: Executar rebrand integral
        run: python3 scripts/pulse_full_rebrand_v2.py

      - name: Remover ferramentas temporárias
        shell: bash
        run: |
          rm -f scripts/pulse_full_rebrand.py scripts/pulse_full_rebrand_v2.py
          rm -rf .github

      - name: Auditoria final de identidade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          legal = {'LICENSE', 'LICENSE.md', 'NOTICE.md'}
          forbidden = ('simpmusic', 'simpmusic.org', 'simpmusic://')
          hits = []
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.name in legal:
                  continue
              rel = p.as_posix().lower()
              if 'simpmusic' in rel:
                  hits.append(f'caminho: {p.as_posix()}')
                  continue
              if p.suffix.lower() not in {'.kt','.kts','.java','.xml','.md','.txt','.json','.yml','.yaml','.toml','.properties','.gradle','.pro','.conf','.cfg','.sh','.ps1','.bat','.html','.css','.js','.ts','.swift','.plist','.py','.svg'} and p.name not in {'gradlew','gradlew.bat','.gitignore','.gitattributes','Dockerfile','conveyor.conf','Gemfile','Podfile'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8').lower()
              except (UnicodeDecodeError, OSError):
                  continue
              if any(token in text for token in forbidden):
                  hits.append(p.as_posix())
          if hits:
              print('\n'.join(hits[:250]))
              raise SystemExit(f'Encontradas {len(hits)} referências antigas')
          print('Auditoria final: 0 referências SimpMusic fora dos avisos legais.')
          PY

      - name: Gravar rebrand no GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hugo"
          git config user.email "hugo.oracle@gmail.com"
          git add -A
          git status --short
          git commit -m "refactor: complete Pulse identity migration [pulse-rebrand]"
          git push origin HEAD:refactor/pulse-full-rebrand
